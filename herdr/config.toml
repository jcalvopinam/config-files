# https://herdr.dev/docs/configuration/#keybindings

onboarding = false

[theme]
name = "one-dark"
auto_switch = true
light_name = "one-light"
dark_name = "one-dark"

[keys]
prefix = "ctrl+b"

close_workspace = ["prefix+shift+d", "ctrl+q"]
close_pane = ["prefix+shift+x", "ctrl+w"]
split_horizontal = ["prefix+minus","ctrl+enter"]
split_vertical = ["prefix+v","ctrl+shift+enter"]
zoom = ["prefix+z","ctrl+alt+enter"]

goto = ["prefix+g", "ctrl+g"]
switch_tab = ["prefix+1..9", "ctrl+1..9"]
switch_workspace = ["prefix+shift+1..9", "ctrl+shift+1..9"]
focus_agent = ["prefix+alt+1..9"]
next_agent = "prefix+down"
previous_agent = "prefix+up"

focus_pane_left = ["prefix+h", "ctrl+alt+left"]
focus_pane_down = ["prefix+j", "ctrl+alt+down"]
focus_pane_up = ["prefix+k", "ctrl+alt+up"]
focus_pane_right = ["prefix+l", "ctrl+alt+right"]

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["git_status", "branch"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", fg = "#629cd2", bold = true }],
  ["state_text", { token = "agent", fg = "#b26cdb" }],
]

[remote]
manage_ssh_config = true

[[keys.command]]
key = "prefix+ctrl+l"
type = "popup"          # also: "pane", "shell", "plugin_action"
command = "lazygit"
description = "run lazygit"
width = "95%"
height = "95%"
